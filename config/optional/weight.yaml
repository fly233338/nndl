# Independent visual weight experiment: no LLM or nutrition database configuration.
seed: 2026
data_dir: data/processed/meal_json
image_root: ""
weight:
  encoder_path: models/dinov2-small
  device: auto
  artifact_path: results/nutrition_agent/weight/ridge.joblib
  min_weight_g: 1.0
  cv_splits: 5
  # Related views of one dish must share this field.
  group_field: image_id
  ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
cache:
  train_path: data/processed/nutrition_agent/train_visual_v2.jsonl
  val_path: data/processed/nutrition_agent/val_visual_v2.jsonl
  test_path: data/processed/nutrition_agent/test_visual_v2.jsonl
