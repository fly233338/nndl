base: 02_recipe.yaml
output_dir: results/captioning_improved/03_augmentation
preprocessing:
  resize_mode: letterbox
  interpolation: bicubic
  exif_transpose: true
augmentation:
  horizontal_flip: 0.5
  rotation: 5
  brightness: 0.1
  contrast: 0.1
  saturation: 0.05
  hue: 0.01
  random_erasing: 0.0
  erasing_scale: [0.005, 0.02]
  erasing_ratio: [0.5, 2.0]
  direction_words: [left, right, clockwise, counterclockwise]
  color_words: [red, green, blue, yellow, orange, purple, pink, white, black, brown, golden, dark, light, pale, gray, grey, beige]
