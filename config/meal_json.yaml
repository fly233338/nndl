seed: 2026
data_dir: data/processed/meal_json
image_root: ""
output_dir: results/meal_json
image_size: 224
caption_model: vit_transformer
vit_path: models/vit-base-patch16-224
max_length: 512
caption_model_checkpoint: results/captioning/vit_transformer/best.pt
freeze_encoder: false
text_projection_template: "A meal contains {items}."
qwen:
  model_name: Qwen/Qwen3-VL-4B-Instruct
  dtype: bfloat16
  load_in_4bit: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  learning_rate: 0.00002
  epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 8
  image_size: 448
  gradient_checkpointing: false
comparison_model:
  model_name: Qwen/Qwen2.5-VL-3B-Instruct
